services:
  - type: web
    name: comic-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
      - key: ADDITIONAL_CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
